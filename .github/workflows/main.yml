name: CI
on: [push]
jobs:
  build:
    name: Build, lint, and test (Bun)

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
